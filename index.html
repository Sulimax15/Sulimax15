<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسواک سولیماکس</title>
<meta name="theme-color" content="#0B6E5F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="سولیماکس">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#F3F6F5;--surface:#FFFFFF;--ink:#13221F;--muted:#5C6E6A;--line:#DCE4E1;
  --accent:#0B6E5F;--accent-ink:#FFFFFF;--accent-soft:#E1F0EC;
  --out:#B4432B;--out-soft:#FBE9E4;--ok:#2E7D32;--ok-soft:#E5F2E6;
  --font:"Vazirmatn","Noto Sans Arabic",Tahoma,system-ui,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1715;--surface:#16211E;--ink:#E6EFEC;--muted:#93A6A1;--line:#26332F;
  --accent:#3FB8A2;--accent-ink:#06201B;--accent-soft:#16352F;
  --out:#F08A72;--out-soft:#3A1E17;--ok:#7BC77F;--ok-soft:#1A3320;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.45rem;font-weight:800;line-height:1.3}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
h2{margin:0;font-size:1.05rem;font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip.out{background:var(--out-soft);color:var(--out)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 170px;min-width:0}
label{font-size:.82rem;color:var(--muted);font-weight:600}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
button.mini{padding:5px 11px;font-size:.84rem;font-weight:600;background:transparent;border:1px solid var(--line);color:var(--muted)}
button.danger{color:var(--out)}
button:disabled{opacity:.5}
.msg{margin:0;font-size:.9rem;color:var(--out)}
.note{margin:0;font-size:.85rem;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools input{flex:1 1 200px;width:auto}.tools select{flex:1 1 150px;width:auto}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1 1 240px}
.seg button{flex:1;background:transparent;color:var(--muted);border-radius:0;font-weight:600;padding:8px 6px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.card .name{font-weight:800;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.card .sub{grid-column:1/-1;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.date{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.card .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.card.done .name{color:var(--muted);text-decoration:line-through}
.state{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;align-self:start}
.state.out{background:var(--out-soft);color:var(--out)}.state.ok{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--ink)}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.login{max-width:400px;margin:8vh auto 0;width:100%}
.logo{width:64px;height:64px;border-radius:16px}
.users{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.urow span{min-width:0}
.urow small{color:var(--muted);direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:10px;font-weight:600;z-index:9}
.install{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="loginView" hidden>
  <div class="panel login">
    <img class="logo" src="/icon-192.png" alt="">
    <h1>مسواک سولیماکس<small>لیستی ماددە تەواوبووەکان</small></h1>
    <form id="loginForm" class="row">
      <div class="field" style="flex-basis:100%"><label for="lu">ناوی بەکارهێنەر</label><input id="lu" autocomplete="username" autocapitalize="none" dir="ltr" required></div>
      <div class="field" style="flex-basis:100%"><label for="lp">وشەی نهێنی</label><input id="lp" type="password" autocomplete="current-password" dir="ltr" required></div>
      <button type="submit" style="flex:1">چوونەژوورەوە</button>
    </form>
    <p class="msg" id="loginMsg" hidden></p>
  </div>
</div>

<!-- MAIN -->
<div class="wrap" id="mainView" hidden>
  <div class="top">
    <h1>مسواک سولیماکس<small id="hello"></small></h1>
    <div class="menu">
      <button class="mini" id="btnUsers" hidden>بەکارهێنەران</button>
      <button class="mini" id="btnPass">وشەی نهێنی</button>
      <button class="mini danger" id="btnOut">چوونەدەرەوە</button>
    </div>
  </div>

  <div class="install" id="installBox" hidden>
    <span id="installText"></span>
    <span style="display:flex;gap:6px"><button class="mini" id="installBtn" hidden>ئینستاڵکردن</button><button class="mini" id="installClose">داخستن</button></span>
  </div>

  <!-- change password -->
  <section class="panel" id="passPanel" hidden>
    <h2>گۆڕینی وشەی نهێنی</h2>
    <form class="row" id="passForm">
      <div class="field"><label for="po">وشەی نهێنیی ئێستا</label><input id="po" type="password" autocomplete="current-password" dir="ltr" required></div>
      <div class="field"><label for="pn">وشەی نهێنیی نوێ</label><input id="pn" type="password" autocomplete="new-password" dir="ltr" minlength="4" required></div>
      <button type="submit">گۆڕین</button>
    </form>
    <p class="msg" id="passMsg" hidden></p>
  </section>

  <!-- users (admin) -->
  <section class="panel" id="usersPanel" hidden>
    <h2>بەڕێوەبردنی بەکارهێنەران</h2>
    <div class="users" id="userList"></div>
    <form class="row" id="userForm">
      <div class="field"><label for="un">ناوی تەواو</label><input id="un" maxlength="40" placeholder="ئاراس محەمەد" required></div>
      <div class="field"><label for="uu">ناوی بەکارهێنەر (ئینگلیزی)</label><input id="uu" maxlength="40" dir="ltr" autocapitalize="none" placeholder="aras" required></div>
      <div class="field"><label for="upw">وشەی نهێنی</label><input id="upw" dir="ltr" minlength="4" required></div>
      <div class="field" style="flex:0 1 140px"><label for="ur">جۆر</label><select id="ur"><option value="user">بەکارهێنەر</option><option value="admin">لیژنە</option></select></div>
      <button type="submit">زیادکردن</button>
    </form>
    <p class="msg" id="userMsg" hidden></p>
  </section>

  <!-- add item -->
  <section class="panel">
    <h2>تۆمارکردنی ماددەی تەواوبوو</h2>
    <form class="row" id="addForm">
      <div class="field" style="flex-basis:220px"><label for="iname">ناوی ماددە</label><input id="iname" maxlength="80" placeholder="مسواکی منداڵان – شین" required></div>
      <div class="field"><label for="inote">تێبینی (ئارەزوومەندانە)</label><input id="inote" maxlength="120" placeholder="بڕ، قەبارە، کۆمپانیا…"></div>
      <button type="submit" id="addBtn">زیادکردن</button>
    </form>
    <p class="msg" id="addMsg" hidden></p>
  </section>

  <div class="top">
    <div class="chips"><span class="chip out" id="cOut"></span><span class="chip ok" id="cOk"></span></div>
    <button class="ghost" id="copyBtn">کۆپیکردنی لیست</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="گەڕان بە ناوی ماددە…" aria-label="گەڕان">
    <select id="who" aria-label="بەکارهێنەر"><option value="">هەموو بەکارهێنەران</option></select>
    <div class="seg" role="group">
      <button type="button" data-f="out" aria-pressed="true">تەواوبوو</button>
      <button type="button" data-f="ok" aria-pressed="false">پڕکراوە</button>
      <button type="button" data-f="all" aria-pressed="false">هەموو</button>
    </div>
  </div>
  <div class="list" id="list"></div>
  <p class="note" id="sync"></p>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $=id=>document.getElementById(id);
let token=null,me=null,items=[],filter="out",lastVersion=-1;
try{token=localStorage.getItem("sx_token")}catch(e){}

function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function showMsg(id,t){const m=$(id);m.textContent=t||"";m.hidden=!t}
const pad=n=>String(n).padStart(2,"0");
const fmtDate=ms=>{const d=new Date(ms);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()};
const fmtTime=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())};

async function api(path,opts={}){
  const r=await fetch(path,{method:opts.method||"GET",headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:opts.body?JSON.stringify(opts.body):undefined});
  let data={};try{data=await r.json()}catch(e){}
  if(r.status===401&&path!=="/api/login"){logoutLocal();throw new Error(data.error||"پێویستە بچیتە ژوورەوە")}
  if(!r.ok)throw new Error(data.error||"هەڵەیەک ڕوویدا");
  return data;
}

function logoutLocal(){token=null;me=null;try{localStorage.removeItem("sx_token")}catch(e){};$("mainView").hidden=true;$("loginView").hidden=false}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();showMsg("loginMsg","");
  try{const d=await api("/api/login",{method:"POST",body:{username:$("lu").value,password:$("lp").value}});
    token=d.token;try{localStorage.setItem("sx_token",token)}catch(e){};me=d.user;$("lp").value="";startMain();}
  catch(err){showMsg("loginMsg",err.message)}
});

$("btnOut").onclick=async()=>{try{await api("/api/logout",{method:"POST"})}catch(e){};logoutLocal()};
$("btnPass").onclick=()=>{$("passPanel").hidden=!$("passPanel").hidden};
$("btnUsers").onclick=()=>{const p=$("usersPanel");p.hidden=!p.hidden;if(!p.hidden)loadUsers()};

$("passForm").addEventListener("submit",async e=>{
  e.preventDefault();showMsg("passMsg","");
  try{await api("/api/me/password",{method:"POST",body:{old:$("po").value,new:$("pn").value}});$("po").value=$("pn").value="";$("passPanel").hidden=true;toast("وشەی نهێنی گۆڕدرا")}
  catch(err){showMsg("passMsg",err.message)}
});

async function loadUsers(){
  try{const {users}=await api("/api/users");const box=$("userList");box.textContent="";
    users.forEach(u=>{
      const r=document.createElement("div");r.className="urow";
      const s=document.createElement("span");const b=document.createElement("b");b.textContent=u.name;const sm=document.createElement("small");sm.textContent=" @"+u.username;
      s.append(b,sm);if(u.role==="admin"){const c=document.createElement("span");c.className="chip acc";c.style.marginInlineStart="6px";c.textContent="لیژنە";s.append(c)}
      const a=document.createElement("span");a.style.display="flex";a.style.gap="6px";a.style.flexWrap="wrap";
      const rp=document.createElement("button");rp.className="mini";rp.textContent="وشەی نهێنیی نوێ";
      rp.onclick=()=>{ if(a.querySelector("input"))return;
        const i=document.createElement("input");i.dir="ltr";i.placeholder="وشەی نوێ";i.style.width="130px";i.style.padding="5px 8px";
        const ok=document.createElement("button");ok.className="mini";ok.textContent="پاشەکەوت";
        ok.onclick=async()=>{try{await api("/api/users/"+u.id,{method:"PATCH",body:{password:i.value}});toast("وشەی نهێنی گۆڕدرا");loadUsers()}catch(err){toast(err.message)}};
        a.prepend(i,ok)};
      a.append(rp);
      if(u.id!==me.id){const del=document.createElement("button");del.className="mini danger";del.textContent="سڕینەوە";
        del.onclick=()=>{if(del.dataset.sure){api("/api/users/"+u.id,{method:"DELETE"}).then(()=>{toast("سڕایەوە");loadUsers()}).catch(err=>toast(err.message))}else{del.dataset.sure=1;del.textContent="دڵنیایت؟"}};
        a.append(del)}
      r.append(s,a);box.appendChild(r);
    });
  }catch(err){showMsg("userMsg",err.message)}
}
$("userForm").addEventListener("submit",async e=>{
  e.preventDefault();showMsg("userMsg","");
  try{await api("/api/users",{method:"POST",body:{name:$("un").value,username:$("uu").value,password:$("upw").value,role:$("ur").value}});
    $("un").value=$("uu").value=$("upw").value="";toast("بەکارهێنەر زیادکرا");loadUsers()}
  catch(err){showMsg("userMsg",err.message)}
});

$("addForm").addEventListener("submit",async e=>{
  e.preventDefault();showMsg("addMsg","");$("addBtn").disabled=true;
  try{await api("/api/items",{method:"POST",body:{name:$("iname").value,note:$("inote").value}});
    $("iname").value=$("inote").value="";toast("زیادکرا");await load(true)}
  catch(err){showMsg("addMsg",err.message)}
  $("addBtn").disabled=false;
});

function render(){
  const sel=$("who"),cur=sel.value;
  const people=[...new Map(items.map(i=>[i.by,i.byName])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  sel.innerHTML='<option value="">هەموو بەکارهێنەران</option>';
  people.forEach(([id,n])=>{const o=document.createElement("option");o.value=id;o.textContent=n;sel.appendChild(o)});
  sel.value=people.some(p=>p[0]===cur)?cur:"";
  const outN=items.filter(i=>!i.done).length;
  $("cOut").textContent=outN+" تەواوبووە";$("cOk").textContent=(items.length-outN)+" پڕکراوەتەوە";
  const q=$("q").value.trim().toLowerCase(),w=sel.value;
  const list=items.filter(i=>(filter==="all"||(filter==="out"?!i.done:i.done))&&(!w||i.by===w)&&(!q||(i.name+" "+(i.note||"")).toLowerCase().includes(q)));
  const box=$("list");box.textContent="";
  if(!list.length){box.innerHTML=items.length?'<div class="empty"><b>هیچ ئەنجامێک نییە</b>گەڕان یان فلتەرەکان بگۆڕە.</div>':'<div class="empty"><b>هێشتا هیچ ماددەیەک تۆمار نەکراوە</b>یەکەم ماددەی تەواوبوو لە فۆڕمی سەرەوە بنووسە.</div>';return}
  list.forEach(i=>{
    const c=document.createElement("div");c.className="card"+(i.done?" done":"");
    const n=document.createElement("div");n.className="name";n.textContent=i.name;
    const st=document.createElement("span");st.className="state "+(i.done?"ok":"out");st.textContent=i.done?"پڕکراوەتەوە":"تەواوبووە";
    c.append(n,st);
    if(i.note){const s=document.createElement("div");s.className="sub";s.textContent=i.note;c.append(s)}
    const m=document.createElement("div");m.className="meta";
    const d=document.createElement("span");d.innerHTML='بەروار: <b class="date"></b>';d.querySelector("b").textContent=fmtDate(i.at)+"  "+fmtTime(i.at);
    const by=document.createElement("span");by.innerHTML="نووسەر: <b></b>";by.querySelector("b").textContent=i.byName;
    m.append(d,by);
    if(i.done&&i.doneAt){const x=document.createElement("span");x.innerHTML='پڕکرایەوە: <b class="date"></b>';x.querySelector("b").textContent=fmtDate(i.doneAt)+(i.doneByName?" – ":"");if(i.doneByName){const y=document.createElement("b");y.textContent=i.doneByName;x.append(y)}m.append(x)}
    c.append(m);
    const a=document.createElement("div");a.className="acts";
    const t=document.createElement("button");t.className="mini";t.textContent=i.done?"گەڕاندنەوە بۆ تەواوبوو":"پڕکرایەوە";
    t.onclick=async()=>{t.disabled=true;try{await api("/api/items/"+i.id,{method:"PATCH",body:{done:!i.done}});await load(true)}catch(err){toast(err.message);t.disabled=false}};
    a.append(t);
    if(i.by===me.id||me.role==="admin"){const del=document.createElement("button");del.className="mini danger";del.textContent="سڕینەوە";
      del.onclick=async()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent="دڵنیایت؟ دووبارە دابگرە";return}
        try{await api("/api/items/"+i.id,{method:"DELETE"});toast("سڕایەوە");await load(true)}catch(err){toast(err.message)}};
      a.append(del)}
    c.append(a);box.appendChild(c);
  });
}
$("q").addEventListener("input",render);$("who").addEventListener("change",render);
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()});

$("copyBtn").onclick=async()=>{
  const out=items.filter(i=>!i.done);
  const txt="ماددە تەواوبووەکانی مسواک سولیماکس ("+fmtDate(Date.now())+"):\n"+(out.length?out.map((i,k)=>(k+1)+". "+i.name+(i.note?" ("+i.note+")":"")).join("\n"):"هیچ ماددەیەک تەواو نەبووە.");
  try{await navigator.clipboard.writeText(txt);toast("لیستەکە کۆپی کرا")}
  catch(e){if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else toast("کۆپی نەکرا")}
};

async function load(force){
  if(!token)return;
  try{const d=await api("/api/items");if(force||d.version!==lastVersion){items=d.items;lastVersion=d.version;render()}
    $("sync").textContent="دوایین نوێکردنەوە: "+fmtTime(Date.now())+" — لیستەکە هەر ١٥ چرکە جارێک خۆی نوێ دەکاتەوە.";}
  catch(e){$("sync").textContent="پەیوەندی بە سێرڤەرەوە نییە، دووبارە هەوڵ دەدرێتەوە…"}
}

async function startMain(){
  try{if(!me)me=(await api("/api/me")).user}catch(e){$("loginView").hidden=false;if(token)showMsg("loginMsg","پەیوەندی بە سێرڤەرەوە نییە، دواتر هەوڵبدەرەوە.");return}
  $("loginView").hidden=true;$("mainView").hidden=false;
  $("hello").textContent="بەخێربێیت، "+me.name+(me.role==="admin"?" (لیژنە)":"");
  $("btnUsers").hidden=me.role!=="admin";
  lastVersion=-1;await load(true);setupInstall();
}
setInterval(()=>{if(!document.hidden)load()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});

// ---- install to home screen ----
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;setupInstall()});
function setupInstall(){
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  let closed=false;try{closed=localStorage.getItem("sx_install_closed")==="1"}catch(e){}
  if(standalone||closed||!me)return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferred){$("installText").textContent="ئەم بەرنامەیە دەتوانیت وەک ئەپ لەسەر شاشەی مۆبایلەکەت دابنێیت.";$("installBtn").hidden=false;$("installBox").hidden=false}
  else if(ios){$("installText").textContent="بۆ دانانی لەسەر شاشە: لە Safari دوگمەی Share (□↑) دابگرە، پاشان «Add to Home Screen».";$("installBox").hidden=false}
}
$("installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$("installBox").hidden=true};
$("installClose").onclick=()=>{$("installBox").hidden=true;try{localStorage.setItem("sx_install_closed","1")}catch(e){}};

if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{})}
if(token)startMain();else $("loginView").hidden=false;
</script>
</body>
</html>
